name: Bug report
description: Report a reproducible OpenDeepL defect using synthetic content only.
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not post secrets, real documents, personal screenshots, signing keys, or private logs. For security issues, use the private route in SECURITY.md.
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - macOS
        - Windows
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Base app and runtime versions
      placeholder: "Source/native base 0.6.3; runtime version if applicable"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Use a small synthetic example.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and safe diagnostics
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed real user content and secrets from this report.
          required: true
