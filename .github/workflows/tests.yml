name: Source tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: source-tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      PYTHONUTF8: '1'
      OPENDEEPL_PDF_FONT: 'dist/test-fonts/NotoSansSC-Regular.ttf'
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install locked JavaScript dependencies
        run: npm ci --ignore-scripts
      - name: Install document test dependencies
        run: python -m pip install 'lxml==6.1.3' 'PyMuPDF==1.28.2' 'Jinja2==3.1.6' 'pypdf==6.21.0' 'pypdfium2==5.3.0' 'reportlab==4.4.5' 'fonttools==4.60.1'
      - name: JavaScript unit tests (native signing is opt-in)
        run: node --test Tests/*.cjs
      - name: Prepare PDF test font
        run: python scripts/prepare_pdf_test_font.py
      - name: Python tests (no model downloads)
        run: python -m unittest discover -s Tests -p "test_*.py" -v
      - name: Check public-source boundaries and documentation links
        run: python scripts/check_public_source.py
