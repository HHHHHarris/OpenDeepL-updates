<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; font-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'"><title>OpenDeepL</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="setup.css"></head><body>
<header class="appbar"><nav aria-label="翻译操作"><button class="tab active" id="textTab"><svg><use href="#text-icon"/></svg>文本</button><button class="tab" id="docTab"><svg><use href="#document-icon"/></svg>文档</button></nav><span class="appname">OpenDeepL</span><div class="app-actions"><button id="setupButton" class="toolbar-button" aria-controls="setupPanel" aria-expanded="false">模型</button><span class="local-label"><i></i> 本机翻译</span><button class="icon" id="historyButton" title="翻译历史" aria-label="翻译历史"><svg><use href="#history-icon"/></svg></button><button class="icon" id="settingsButton" title="设置" aria-label="设置"><svg><use href="#menu-icon"/></svg></button></div></header>
<main><section class="workspace"><div class="languagebar"><label class="language"><span class="sr-only">源语言</span><select id="sourceLanguage"><option value="auto">检测源语言</option><option value="English">英语</option><option value="Chinese">中文（简体）</option><option value="Japanese">日语</option><option value="French">法语</option><option value="German">德语</option><option value="Spanish">西班牙语</option><option value="Korean">韩语</option><option value="Portuguese">葡萄牙语</option><option value="Russian">俄语</option><option value="Italian">意大利语</option><option value="Arabic">阿拉伯语</option></select></label><button class="icon swap" id="swapButton" title="交换语言和文本" aria-label="交换语言和文本"><svg><use href="#swap-icon"/></svg></button><label class="language"><span class="sr-only">目标语言</span><select id="targetLanguage"><option value="Chinese">中文（简体）</option><option value="English">英语</option><option value="Japanese">日语</option><option value="French">法语</option><option value="German">德语</option><option value="Spanish">西班牙语</option><option value="Korean">韩语</option><option value="Portuguese">葡萄牙语</option><option value="Russian">俄语</option><option value="Italian">意大利语</option><option value="Arabic">阿拉伯语</option></select></label><button class="toolbar-button" id="glossaryButton"><svg><use href="#book-icon"/></svg>术语表</button></div>
<div class="editors" id="textWorkspace"><section class="pane source-pane" aria-label="原文"><div class="pane-top"><span id="fileName"></span><button class="icon" id="clearButton" title="清空原文" aria-label="清空原文"><svg><use href="#close-icon"/></svg></button></div><textarea id="sourceText" spellcheck="false" aria-label="原文" placeholder="输入或粘贴文本进行翻译"></textarea><div class="source-empty" id="sourceEmpty"><button id="importButton"><svg><use href="#document-icon"/></svg><span>打开文本文件<small>TXT · Markdown · SRT · CSV</small></span></button></div><div class="pane-actions"><span id="characterCount">0 字符</span><div class="input-tools"><button class="icon" id="screenshotButton" title="框选截图并翻译" aria-label="框选截图并翻译"><svg><use href="#region-icon"/></svg></button><button class="icon" id="ocrButton" title="从图片识别文本（本地 OCR）" aria-label="从图片识别文本"><svg><use href="#scan-icon"/></svg></button></div></div></section>
<section class="pane result-pane" aria-label="译文"><div class="pane-top result-top"><label>语气 <select id="tone"><option value="default">默认</option><option value="formal">正式</option><option value="natural">自然</option></select></label></div><div id="resultText" class="translation" role="textbox" aria-label="译文" aria-readonly="true" tabindex="0"></div><div id="resultEmpty" class="result-empty">译文将在这里显示</div><div class="pane-actions result-actions"><span id="translationMeta"></span><div><button id="retranslateButton" class="quiet-button retranslate-button" hidden>用 7B 重译</button><button class="icon" id="exportButton" title="导出译文" aria-label="导出译文" disabled><svg><use href="#download-icon"/></svg></button><button class="icon" id="copyButton" title="复制译文" aria-label="复制译文" disabled><svg><use href="#copy-icon"/></svg></button></div></div></section></div>
<section id="documentWorkspace" class="document-workspace" aria-label="文档翻译" hidden><div class="document-intro"><svg><use href="#document-icon"/></svg><h1>批量翻译文档</h1><p>DOCX · PPTX · PDF<br>在本机处理，另存译文，不覆盖原件。</p><button id="chooseDocument" class="primary">选择文档</button>
<p class="document-limit">每批最多 20 个文件。译文保存为新文件，原件保持不变。</p></div><div class="document-details" id="documentDetails" hidden><strong id="documentName"></strong><span id="documentSize"></span><p id="documentProgress" role="status">选择文档后，设置语言并开始翻译。</p>
<div class="document-progress-labels"><span id="documentTotalLabel">总进度</span><span id="documentTotalCount"></span></div><progress id="documentProgressBar" max="100" value="0" aria-label="文档翻译进度"></progress><p id="documentCurrentProgress" class="document-current-progress" role="status"></p>
<progress id="documentCurrentProgressBar" max="100" value="0" aria-label="当前文档进度" hidden></progress>
<div id="documentList" class="document-list" aria-label="文档队列"></div>
<div class="document-actions"><button id="retryDocuments" class="quiet-button" hidden>重试未完成项</button><button id="revealDocument" class="quiet-button" disabled>在文件夹中显示译文</button></div><p class="document-note">尽量保留支持的段落、样式和页面结构；复杂排版请核对输出。扫描 PDF 需有可提取文字层。已完成文件可分别在文件夹中显示。</p></div></section>
<div id="permissionNotice" class="permission-notice" role="status" aria-live="polite" hidden><span id="permissionNoticeText"></span><button id="permissionNoticeSettings" class="quiet-button">查看设置</button><button id="permissionNoticeDismiss" class="icon" aria-label="关闭权限提示"><svg><use href="#close-icon"/></svg></button></div><footer><div class="engine-state"><span id="stateDot" class="state-dot"></span><span id="engineState">正在检查本地引擎</span><label class="model-select"><span class="sr-only">翻译模型</span><select id="modelMode" aria-label="翻译模型"><option value="quality">标准 · 7B</option><option value="fast">快速 · 1.8B</option></select></label></div><div class="translate-controls"><label class="auto"><input type="checkbox" id="autoTranslate" checked>自动翻译</label><span class="shortcut" id="shortcut">⌘ ↵</span><button class="primary" id="translateButton">翻译</button><button id="cancelButton" class="cancel" hidden>停止翻译</button></div></footer><div id="notice" role="status" hidden></div>
</section><aside id="drawer" hidden><div class="drawer-head"><h2 id="drawerTitle">设置</h2><button class="icon" id="closeDrawer" aria-label="关闭侧栏"><svg><use href="#close-icon"/></svg></button></div><div id="drawerContent"></div></aside></main>
<svg class="symbols" aria-hidden="true" xmlns="http://www.w3.org/2000/svg"><defs>
<symbol id="text-icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c5 5 5 13 0 18-5-5-5-13 0-18"/></symbol><symbol id="document-icon" viewBox="0 0 24 24"><path d="M6 3h8l4 4v14H6zM14 3v5h4M9 12h6M9 16h6"/></symbol><symbol id="swap-icon" viewBox="0 0 24 24"><path d="M4 8h16m-4-4 4 4-4 4M20 16H4m4-4-4 4 4 4"/></symbol><symbol id="menu-icon" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></symbol><symbol id="close-icon" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol><symbol id="history-icon" viewBox="0 0 24 24"><path d="M3 10a9 9 0 1 1 1 7M3 4v6h6M12 7v6l4 2"/></symbol><symbol id="book-icon" viewBox="0 0 24 24"><path d="M4 4h7l1 2 1-2h7v16h-7l-1 1-1-1H4zM12 6v15"/></symbol><symbol id="copy-icon" viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="13" rx="2"/><path d="M16 8V3H3v13h5"/></symbol><symbol id="download-icon" viewBox="0 0 24 24"><path d="M12 3v12m-5-5 5 5 5-5M4 16v5h16v-5"/></symbol><symbol id="region-icon" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M1 8h7M8 1v7m8 8h7m-7 0v7"/></symbol><symbol id="scan-icon" viewBox="0 0 24 24"><path d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5M7 8h10M7 12h10M7 16h6"/></symbol>
</defs></svg><script src="setup-policy.js"></script>
  <script src="setup.js"></script><script src="app.js"></script></body></html>
